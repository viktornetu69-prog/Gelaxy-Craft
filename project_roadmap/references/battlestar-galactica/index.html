<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Battlestar Galactica - Референсы</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 20px 0; }
        .gallery img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
        .placeholder { background: #21262d; height: 150px; display: flex; align-items: center; justify-content: center; color: #665a5a; border-radius: 4px; margin: 5px 0; }
        .nav-back { margin-bottom: 20px; text-align: left; }
    </style>
</head>
<body>
<div class="nav-back" style="text-align: left;"><a href="../index.html" style="color:#8b949e;">← На главную дорожную карту</a></div>
<h1>Battlestar Galactica - Референсные изображения</h1>
<div class="gallery" id="gallery"></div>

<script>
    // Умный скрипт: рекурсивно загружает все изображения из папки images/
    // Останавливается когда изображение не найдено (автоматическое ограничение)
    const gallery = document.getElementById('gallery');
    
    (function loadImages(i) {
        const img = new Image();
        img.onload = function() {
            gallery.appendChild(img);
            loadImages(i + 1); // Загружаем следующее изображение
        };
        img.onerror = function() {
            // Изображение не найдено - загрузка останавливается автоматически
        };
        img.src = 'images/' + i + '.jpg';
    })(1); // Начинаем с 1
</script>
</body>
</html>
